name: Dependency security

on:
  push:
    paths:
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer audit --locked

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run build
